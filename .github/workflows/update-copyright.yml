name: Copyright

on:
  schedule:
    # Runs "At 08:00 on day-of-month 1 in January"
    - cron: '0 8 1 1 *'

  workflow_dispatch:

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI

permissions:
  contents: write
  pull-requests: write

jobs:
  copyright:
    name: Copyright
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4.1.1
    - uses: ./.github/actions/ruby-cache
    - name: Generate release bot token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
    - run: bundle exec fastlane copyright
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        job_name: "${{ github.workflow }}: ${{ github.job }}"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_IOS_BOTS }}
      if: failure()
